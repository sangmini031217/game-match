<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Matching</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="landing">
    <div class="landing-top">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="ko">한국어</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>
    </div>
    <h1 class="landing-title">Team Matching</h1>
    <p class="landing-sub" id="subtitle"></p>
    <div class="card-grid">
      <a class="mode-card" href="lol/index.html">
        <div class="mode-badge">5 vs 5</div>
        <div class="mode-title" id="lolTitle"></div>
        <div class="mode-desc" id="lolDesc"></div>
      </a>
      <a class="mode-card" href="tft/index.html">
        <div class="mode-badge" id="tftBadge">2인조</div>
        <div class="mode-title" id="tftTitle"></div>
        <div class="mode-desc" id="tftDesc"></div>
      </a>
      <a class="mode-card" href="ow/index.html">
        <div class="mode-badge" id="owBadge">5 vs 5 / 6 vs 6</div>
        <div class="mode-title" id="owTitle"></div>
        <div class="mode-desc" id="owDesc"></div>
      </a>
    </div>
  </div>
  <script src="shared/tierData.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
